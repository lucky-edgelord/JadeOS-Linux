set default="0"
set timeout=8

# INSTALLER-BEGIN
menuentry "Install JadeOS on this computer  (or just try it from this USB stick)" {
	linux /bzImage root=PARTUUID=UUID_TMP rootwait ro loglevel=4 console=tty1 console=ttyS0,115200 jade.install=1
}
menuentry "Install JadeOS - safe graphics (use this if the screen stays black)" {
	linux /bzImage root=PARTUUID=UUID_TMP rootwait ro loglevel=4 nomodeset console=tty1 console=ttyS0,115200 jade.install=1
}
menuentry "Run JadeOS from this USB stick (no install)" {
	linux /bzImage root=PARTUUID=UUID_TMP rootwait ro loglevel=4 console=tty1 console=ttyS0,115200
}
# INSTALLER-END
menuentry "JadeOS-Linux" {
	linux /bzImage root=PARTUUID=UUID_TMP rootwait ro quiet loglevel=3 console=tty1 console=ttyS0,115200
}
menuentry "JadeOS-Linux (verbose, shell on console)" {
	linux /bzImage root=PARTUUID=UUID_TMP rootwait ro console=tty1 console=ttyS0,115200 jade.nokiosk=1
}
