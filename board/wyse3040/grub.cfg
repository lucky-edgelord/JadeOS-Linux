set default="0"
set timeout="2"

menuentry "JadeOS-Linux" {
	linux /bzImage root=PARTUUID=UUID_TMP rootwait ro quiet loglevel=3 console=tty1 console=ttyS0,115200
}
menuentry "JadeOS-Linux (verbose, shell on console)" {
	linux /bzImage root=PARTUUID=UUID_TMP rootwait ro console=tty1 console=ttyS0,115200 jade.nokiosk=1
}
