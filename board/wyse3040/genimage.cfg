image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}
		file bzImage {
			image = "bzImage"
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "jadedata"
		use-mke2fs = true
	}
	mountpoint = "/data"
	size = 256M
}

image jadeos-wyse3040.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		offset = 32K
		bootable = true
	}

	partition root {
		partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
		partition-uuid = UUID_TMP
		image = "rootfs.ext2"
	}

	partition data {
		partition-type-uuid = 0fc63daf-8483-4772-8e79-3d69d8477de4
		image = "data.ext4"
	}
}
